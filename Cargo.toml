[workspace]
resolver = "2"
members = [
    "crates/wein-platform",
    "crates/wein-sched",
    "crates/wein-memory",
    "crates/wein-engine",
    "crates/wein-serve",
    "crates/wein-cli",
    "crates/wein-bench",
    "crates/wein-kernel",
    "crates/wein-exec",
    "crates/wein-model",
]
exclude = [
    # kernels/ 由 wein-kernel/build.rs 以独立 cargo 调用构建（nvptx64 目标 + build-std），
    # 不属于本 workspace（其 Cargo.toml 内空 [workspace] 表自绝）
    "crates/wein-kernel/kernels",
]

# W1 后续补 wein-exec / wein-model（02-architecture §2）

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true
