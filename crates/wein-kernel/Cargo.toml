[package]
name = "wein-kernel"
version = "0.1.0"
edition = "2021"
description = "算子层：cuda/ 纯 Rust→PTX + driver 绑定 + Op 注册表（02-architecture §4）"

[dependencies]
libloading = "0.8"
wein-platform = { path = "../wein-platform" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "jit-cache-probe"
path = "src/bin/jit_cache_probe.rs"
